<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="petal-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB2C3" />
      <stop offset="50%" stop-color="#F27D95" />
      <stop offset="100%" stop-color="#D65874" />
    </linearGradient>
    <linearGradient id="petal-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA8BA" />
      <stop offset="100%" stop-color="#E26A84" />
    </linearGradient>
    <radialGradient id="center-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="40%" stop-color="#FCD34D" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0F5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFF0F5" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#831843" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glow-grad)" />
  <!-- Flower Group with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- 5 Main Blossom Petals -->
    <path d="M 32 32 C 24 16, 20 8, 32 4 C 44 8, 40 16, 32 32 Z" fill="url(#petal-grad-1)" />
    <path d="M 32 32 C 46 20, 56 22, 59 34 C 54 44, 44 40, 32 32 Z" fill="url(#petal-grad-2)" />
    <path d="M 32 32 C 42 46, 44 56, 34 60 C 24 57, 26 46, 32 32 Z" fill="url(#petal-grad-1)" />
    <path d="M 32 32 C 20 46, 10 52, 6 41 C 8 29, 20 28, 32 32 Z" fill="url(#petal-grad-2)" />
    <path d="M 32 32 C 16 22, 10 12, 21 7 C 29 9, 28 20, 32 32 Z" fill="url(#petal-grad-1)" />

    <!-- Inner Soft Petal Highlights -->
    <g transform="rotate(36 32 32)">
      <path d="M 32 32 C 26 20, 24 14, 32 10 C 40 14, 38 20, 32 32 Z" fill="#FFAEC0" opacity="0.85" />
      <path d="M 32 32 C 42 24, 48 26, 51 34 C 47 41, 40 38, 32 32 Z" fill="#FF9EBA" opacity="0.85" />
      <path d="M 32 32 C 39 42, 40 48, 33 51 C 26 48, 27 41, 32 32 Z" fill="#FFAEC0" opacity="0.85" />
      <path d="M 32 32 C 23 42, 16 46, 13 39 C 14 30, 22 30, 32 32 Z" fill="#FF9EBA" opacity="0.85" />
      <path d="M 32 32 C 21 24, 17 17, 24 13 C 30 15, 29 22, 32 32 Z" fill="#FFAEC0" opacity="0.85" />
    </g>

    <!-- Golden Pistil Center -->
    <circle cx="32" cy="32" r="7.5" fill="url(#center-grad)" stroke="#FFFFFF" stroke-width="0.8" />
    <circle cx="32" cy="28.5" r="1.1" fill="#FEF08A" />
    <circle cx="35" cy="30" r="1.1" fill="#FEF08A" />
    <circle cx="34" cy="34" r="1.1" fill="#FEF08A" />
    <circle cx="30" cy="34" r="1.1" fill="#FEF08A" />
    <circle cx="29" cy="30.5" r="1.1" fill="#FEF08A" />
    <circle cx="32" cy="32" r="1.3" fill="#FFFBEB" />
  </g>
</svg>
